version: '3.8'

services:
  # Kept only for the one-time Mongo -> MySQL migration tool
  # (server/scripts/migrate-mongo-to-mysql). The running application no
  # longer connects to MongoDB.
  mongodb:
    image: mongo:7
    container_name: green-leaf-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - green-leaf-mongo-data:/data/db

  # Local dev + test database. Production MySQL is provisioned separately on
  # BigRock — this container is never used in production.
  mysql:
    image: mysql:8
    container_name: green-leaf-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: greenkart
    ports:
      - '3306:3306'
    volumes:
      - green-leaf-mysql-data:/var/lib/mysql

volumes:
  green-leaf-mongo-data:
  green-leaf-mysql-data:
